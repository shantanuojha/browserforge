name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: extensions-chrome-mv3
          path: extensions/*/.output/chrome-mv3
          # WXT writes to the dot-prefixed `.output/`, which upload-artifact treats as hidden.
          include-hidden-files: true
          retention-days: 7
